[project]
name = "helioguard"
version = "0.1.0"
description = "Physics-verified storm decisions for satellites in Earth orbit"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["helioguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
