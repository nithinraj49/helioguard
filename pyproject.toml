[project]
name = "helioguard"
version = "0.1.0"
description = "Physics-verified storm decisions for satellites in Earth orbit"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "numpy", "pymsis>=0.13", "sgp4"]

[project.optional-dependencies]
dev = ["pytest>=8"]
tools = ["pennylane>=0.40", "pennylane-lightning", "ortools", "torch"]
quantum = ["pennylane>=0.40", "pennylane-lightning", "scipy"]
harness = ["transformers", "requests", "torch"]
sft = ["transformers", "peft", "torch", "safetensors"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["helioguard", "helioguard.data", "helioguard.tools", "verispace_engine", "verispace_engine.harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest_tmp -m \"not slow\""
markers = ["slow: minutes-long tests (CPU model training); run with pytest -m slow"]
